name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Lint and formatting do not depend on the platform: one runner is enough.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # format:check compares with the base commit to find the files this change adds.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
  # The browser preview (npm run dev:ui) in Chromium: axe on both runners, and the screenshots on
  # macOS only, where the baselines in e2e/__snapshots__ were drawn (e2e/preview.spec.ts).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # A cached browser still needs the system libraries, which live outside the cache.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7
  verify:
    strategy:
      # One platform's failure must not hide what the others report.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # The boot smoke below runs the Tauri app (crates/relay-app).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev pkg-config xvfb
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Widget strings match the catalogs
        run: node --import tsx scripts/i18n/widget-strings.ts --check
      - name: Rust catalogs match the catalogs
        run: node --import tsx scripts/i18n/export-catalogs.ts --check
      - run: npm test
      - run: npm run build:ui
      # Relay boots with a fresh profile, its page answers `snapshot` through the bridge and it
      # exits cleanly (scripts/smoke-boot.mjs, docs/windows-verification.md).
      - name: Build the boot smoke
        run: cargo build -p relay-app --features smoke
      - name: Boot smoke
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run test:boot
      - name: Desktop IPC integration
        if: runner.os == 'macOS'
        run: npm run test:desktop
  # The Rust workspace (Cargo.toml): the core, the gateway, the catalogs, the CLI and the app.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain rust-toolchain.toml pins, so a new stable's lints never fail an old commit.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # relay-app (Tauri) links WebKitGTK, the tray's appindicator, libxdo and D-Bus on Linux.
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  # Relay 1.0's packages (crates/relay-app, Tauri), as the release makes them but unsigned (ad hoc on
  # macOS) and in debug: a debug bundle costs little more than the compile itself, and only bundling
  # runs the NSIS hook (crates/relay-app/windows/installer-hooks.nsh), linuxdeploy, the Info.plist
  # merge, the macOS signing layout and the release names with their electron-updater files.
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev pkg-config
      - run: npm ci
      # Relay.app with the helper, the CLI and the widget, signed inside out, and its DMG.
      - name: Package Relay.app ad hoc
        if: runner.os == 'macOS'
        run: node scripts/stable-signing.mjs --ad-hoc --debug --dmg --arch arm64 --output release/tauri
      - name: Package the installer
        if: runner.os != 'macOS'
        run: node scripts/tauri-build.mjs --debug --output release/tauri
        env:
          # linuxdeploy, an AppImage itself, then runs without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
  # The Rust CLI and gateway against what the TS originals did (rust/README.md), the golden files
  # the TS wrote opened by Rust, and the cases recorded from deleted shared/ modules. The recordings
  # were made on macOS and replay only there; elsewhere `cargo test` in the job above covers the CLI.
  # Node runs the parity scripts and the napi bindings; no npm package is needed.
  parity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Its own root: caching ~/.cargo/bin would restore stale rustup proxies over the toolchain's.
      - name: Cache rust-anything
        id: rust-anything
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.rust-anything
          key: rust-anything-4.2.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install rust-anything
        if: steps.rust-anything.outputs.cache-hit != 'true'
        run: cargo install rust-anything --locked --version 4.2.0 --root ~/.rust-anything
      - run: echo "$HOME/.rust-anything/bin" >> "$GITHUB_PATH"
      - run: cargo build -p relay-cli --release --features parity
      - name: CLI replay
        run: rust-anything app replay . --build "node scripts/parity/fixture-run.mjs target/release/relay"
      - name: Gateway replay
        run: rust-anything app replay rust/gateway --build "node ../../scripts/parity/gateway-run.mjs ../../target/release/relay"
      - name: Rust opens the TS golden files
        run: cargo test -p relay-core --test golden --test golden_leveldb
      - name: Cases recorded from deleted shared/ modules
        run: cargo test -p relay-core --test recorded_cases
      # Each shared/ unit's napi port against what the TS returned when it was recorded. One target
      # folder for all of them (rust-cache keeps it), and no LTO: link time, not what is compared.
      - name: Unit parity (rust/<unit>-rs)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/units
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          node scripts/parity/cases.mjs unpack
          failed=""
          for crate in rust/*-rs; do
            echo "::group::$crate"
            { rust-anything build "$crate" && rust-anything diff "$crate"; } || failed="$failed $crate"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::unit parity failed:$failed"; exit 1; fi
      - name: Keep the replay reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-reports
          path: |
            rust/app-cases/replay-report.md
            rust/gateway/rust/app-cases/replay-report.md
          retention-days: 7
