name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Desktop IPC and PTY integration
        if: runner.os == 'macOS'
        run: npm run test:desktop
      - name: Package unsigned application
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
