name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.18.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    # Only this job publishes, so only it may write the release.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types and tests
        run: |
          npm run typecheck
          npm test

      - name: Build and Publish Release (Draft-First)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The dispatch input reaches the shell as data, never as script text.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=${INPUT_TAG:-$GITHUB_REF_NAME}
          VERSION=${VERSION#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release version: $VERSION" >&2
            exit 1
          fi
          echo "Releasing version $VERSION"
          node scripts/publish-release.mjs "$VERSION" --force
