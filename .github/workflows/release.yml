name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.18.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types and tests
        run: |
          npm run typecheck
          npm test

      - name: Build and Publish Release (Draft-First)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION=${{ inputs.tag }}
            VERSION=${VERSION#v}
          fi
          echo "Releasing version $VERSION"
          node scripts/publish-release.mjs "$VERSION" --force
