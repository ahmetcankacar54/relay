        <div id="gw-on">

  <script>
    const tl = gsap.timeline({ paused: true });
    const cam = (s, fx, fy) => ({ scale: s, x: 960 - fx * s, y: 540 - fy * s });
    const home = cam(0.96, 375, 400);
    // Punch-ins put the frame's left edge at x 224, past the sidebar; the window's right edge shows.
    const toggle = cam(1.7, 789, 260); // the page's own line and the gateway switch
    const requests = cam(1.8, 757, 508); // the pool (Full, 22 %) beside Recent requests

    // The window waits at the home stage, then pushes in on the switch.
    tl.fromTo("#gw-win", home, { ...toggle, duration: 0.6, ease: "power2.inOut" }, 0.1);
    // 1.1 s here (film 19.8 s): the click turns the gateway on. The page changes at once, as the app
    // does; a crossfade would ghost the reflowed rows.
    tl.fromTo("#gw-on", { opacity: 0 }, { opacity: 1, duration: 0.034, ease: "none" }, 1.1);
    tl.to("#gw-win", { ...requests, duration: 0.6, ease: "power2.inOut" }, 1.5);
    // The newest requests arrive top down: Personal · Backup answers, Personal · Max's 429 moves on.
    const rowTops = [51, 119, 189, 239, 291, 342, 393, 424];
    tl.fromTo(
      "#gw-rows-cover",
      { clipPath: "inset(0px 0px 0px 0px)" },
      { clipPath: `inset(${rowTops[0]}px 0px 0px 0px)`, duration: 0.07, ease: "power2.out" },
      1.85,
    );
    rowTops.slice(1).forEach((top, i) =>
      tl.to("#gw-rows-cover", { clipPath: `inset(${top}px 0px 0px 0px)`, duration: 0.07, ease: "power2.out" }, 1.93 + i * 0.08),
    );
    // The window drops back and blurs out under the end card.
    tl.fromTo(
      "#gw-stage",
      { scale: 1, opacity: 1, filter: "blur(0px)" },
      { scale: 0.86, opacity: 0, filter: "blur(8px)", duration: 0.45, ease: "power3.in" },
      3.95,
    );
    window.__timelines["gateway"] = tl;
