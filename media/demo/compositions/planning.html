  <script>
    const tl = gsap.timeline({ paused: true });
    const cam = (s, fx, fy) => ({ scale: s, x: 960 - fx * s, y: 540 - fy * s });
    const home = cam(0.96, 375, 400);
    const chart = cam(1.65, 806, 327); // the Today chart and "This plan: No gaps · 2 switches"
    const words = { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.07 };
    const hidden = { opacity: 0, filter: "blur(8px)" };

    tl.fromTo("#pl-title h2 span", hidden, words, 0.15);
    tl.fromTo("#pl-title p span", hidden, words, 0.55);
    // Each account's 5-hour windows draw across the day, then the forecast that strings them together.
    const rows = ["#pl-row-max", "#pl-row-backup", "#pl-row-studio", "#pl-row-forecast"];
    rows.forEach((row, i) =>
      tl.fromTo(
        row,
        { clipPath: "inset(0px 100% 0px 0px)" },
        { clipPath: "inset(0px 0% 0px 0px)", duration: 0.9, ease: "power2.inOut" },
        i < 3 ? 0.35 + i * 0.15 : 0.95,
      ),
    );

    tl.to("#pl-title-in", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 2.5);
    // The camera waits at the home stage, pushes in on the chart, and comes back for the sidebar.
    tl.fromTo("#pl-win", home, { ...chart, duration: 0.6, ease: "power2.inOut" }, 2.6);
    tl.to("#pl-win", { ...home, duration: 0.6, ease: "power2.inOut" }, 4.2);
    window.__timelines["planning"] = tl;
