<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* The macOS pointer, 58 px tall (5.4 % of the frame); its tip is 7 px in, 5 px down. */
    #cu-pointer {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 58px;
      transform-origin: 7px 5px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.28));
    }
  </style>
  <div id="root" data-composition-id="cursor" data-width="1920" data-height="1080">
    <svg id="cu-pointer" viewBox="0 0 20 24" aria-hidden="true">
      <path
        d="M3 2 L3 19.5 L7.2 15.6 L10 22 L12.9 20.8 L10.2 14.6 L16 14.6 Z"
        fill="#000000"
        stroke="#ffffff"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // Positions are where the tip points, in frame pixels; times are this scene's (film time - 1.9 s).
    const at = (x, y) => ({ x: x - 7, y: y - 5 });
    const press = (t) => {
      tl.to("#cu-pointer", { scale: 0.86, duration: 0.05, ease: "power2.out" }, t);
      tl.to("#cu-pointer", { scale: 1, duration: 0.1, ease: "power2.out" }, t + 0.08);
    };
    // 1 · Switch on the suggested account in the panel (film 2.6 s), click at 3.0 s.
    // The tip rests on the button under its label, so "Switch" stays readable.
    tl.fromTo("#cu-pointer", { x: 1990 - 7 }, { x: 1722 - 7, duration: 0.7, ease: "power3.out" }, 0);
    tl.fromTo("#cu-pointer", { y: 1160 - 5 }, { y: 664 - 5, duration: 0.7, ease: "power2.out" }, 0);
    press(1.1);
    tl.to("#cu-pointer", { opacity: 0, duration: 0.2, ease: "power1.in" }, 1.3);

    // 2 · Planning in the sidebar (film 12.8 s), click at 13.3 s.
    tl.set("#cu-pointer", at(1180, 1010), 9.9);
    tl.to("#cu-pointer", { opacity: 1, duration: 0.15, ease: "none" }, 10.0);
    tl.to("#cu-pointer", { x: 722 - 7, duration: 0.85, ease: "power3.out" }, 10.0);
    tl.to("#cu-pointer", { y: 321 - 5, duration: 0.85, ease: "power2.out" }, 10.0);
    press(11.4);
    tl.to("#cu-pointer", { opacity: 0, duration: 0.2, ease: "power1.in" }, 11.65);

    // 3 · Proxy & Gateway in the sidebar (film 18.5 s), click at 18.7 s.
    tl.set("#cu-pointer", at(1010, 780), 15.9);
    tl.to("#cu-pointer", { opacity: 1, duration: 0.15, ease: "none" }, 16.0);
    tl.to("#cu-pointer", { x: 784 - 7, duration: 0.6, ease: "power3.out" }, 16.0);
    tl.to("#cu-pointer", { y: 507 - 5, duration: 0.6, ease: "power2.out" }, 16.0);
    press(16.8);

    // 4 · The gateway switch, travelling with the camera (film 19.5 s), click at 19.8 s.
    tl.to("#cu-pointer", { ...at(107, 272), duration: 0.7, ease: "power2.inOut" }, 16.9);
    press(17.9);
    tl.to("#cu-pointer", { opacity: 0, duration: 0.2, ease: "power1.in" }, 18.1);
    window.__timelines["cursor"] = tl;
  </script>
