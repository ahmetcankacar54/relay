[package]
name = "relay-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Parity runs: RELAY_PARITY_NOW pins the clock and RELAY_PROXY_UPSTREAMS is honored in release builds.
parity = ["relay-core/parity"]

[lib]
name = "relay_cli"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-core = { path = "../relay-core" }
relay-gateway = { path = "../relay-gateway" }
async-trait = "0.1.92"
relay-i18n = { path = "../relay-i18n" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-std", "io-util", "time", "sync", "macros"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.26.1", features = ["v4"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
signal-hook = "0.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
