[package]
name = "relay-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.1"
base64 = "0.23.1"
cbc = "0.2.1"
chrono = "0.4.45"
getrandom = "0.4.3"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
sysinfo = "0.36.1"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "3.6.3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
